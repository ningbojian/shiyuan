{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}氏源{% endblock %}</title>
    <style>
        :root { --ink:#3f4438; --muted:#7c7765; --paper:#f7f4ec; --line:#ded7c6; --accent:#9b6f45; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); background:var(--paper); }
        header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 5vw; border-bottom:1px solid var(--line); background:#fffdf7; }
        .brand { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; color:var(--ink); text-decoration:none; }
        .brand img { width:36px; height:36px; object-fit:cover; border-radius:50%; border:1px solid var(--line); }
        nav { display:flex; flex-wrap:wrap; gap:16px; font-size:14px; }
        nav a { color:var(--muted); text-decoration:none; }
        nav a:hover { color:var(--accent); }
        main { max-width:980px; margin:0 auto; padding:44px 22px 70px; }
        h1 { font-size:34px; margin:0 0 16px; letter-spacing:1px; }
        h2 { font-size:20px; color:var(--accent); margin:30px 0 10px; }
        p, li { color:var(--muted); line-height:1.9; font-size:15px; }
        .panel { background:#fffdf8; border:1px solid var(--line); border-radius:12px; padding:24px 28px; margin:18px 0; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .tag { display:inline-block; padding:4px 10px; margin:4px 6px 4px 0; border:1px solid var(--line); border-radius:999px; font-size:12px; color:var(--muted); background:#fff; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); color:var(--muted); }
        th { color:var(--ink); font-weight:600; }
        a { color:var(--accent); }
        footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; border-top:1px solid var(--line); }
        @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<header>
    <a class="brand" href="{% url 'user:index' %}"><img src="{% static 'Surname/img/logo.jpg' %}" alt="氏源">氏源</a>
    <nav>
        <a href="{% url 'user:index' %}">首页</a>
        <a href="{% url 'surname:search' %}">姓氏搜索</a>
        <a href="{% url 'surname:science' %}">姓氏科普</a>
        <a href="{% url 'surname:information' %}">项目资料</a>
        <a href="{% url 'surname:announce' %}">公告</a>
        <a href="{% url 'surname:developer' %}">团队</a>
        <a href="{% url 'user:log' %}">登录</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>氏源 · 数据库课程项目展示 · Django + SQLite/MySQL + ECharts</footer>
</body>
</html>
